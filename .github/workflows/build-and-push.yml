name: Build and push service images

on:
  push:
    branches: [main]
    paths:
      - 'services/web/**'
      - 'services/existdb/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

jobs:
  # Both images are always built together and get the same ga-<run number>
  # tag, so the newest tag is the same in both repositories - no need to look
  # up each repository's latest tag separately before a deploy.
  build-web:
    runs-on: ubuntu-latest
    # utility Environment already holds AWS_DEPLOY_ROLE_ARN for
    # utility-github-actions-deployment-role, which already has grantPush on
    # both ECR repos (see infra/lib/ecr-stack.ts) - same secret used by
    # deploy-infra.yml's utility deploys, no new secret needed here.
    environment: utility
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # ECR repos are imageTagMutability: IMMUTABLE (see ecr-stack.ts), so the
      # tag must be unique per push - ga-<GitHub Actions run number>, matching
      # the `webRevision`/`existdbRevision` context values deploy-infra.yml
      # will later pass to `cdk deploy`. Explicit linux/arm64 since ECS tasks
      # run CpuArchitecture.ARM64 regardless of what architecture the runner
      # itself is.
      - uses: docker/build-push-action@v6
        with:
          context: services/web
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sanakirja-web:ga-${{ github.run_number }}

  build-existdb:
    runs-on: ubuntu-latest
    environment: utility
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/existdb
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sanakirja-existdb:ga-${{ github.run_number }}
