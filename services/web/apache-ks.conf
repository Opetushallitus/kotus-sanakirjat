# Front-controller rewrite: KS's pretty "/<prefix>/<word>" URLs (index.php
# parses $_SERVER['REQUEST_URI'] itself, there's no .htaccess shipped with the
# app) aren't backed by any real file, so route anything that isn't an
# existing file/directory through index.php. Real files (ajax.php, pub/*,
# health.php, robots.txt) are served directly and never reach this rule.
RewriteEngine On
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ /index.php [L]

# cfg/, inc/ and app/ hold application internals - including a plaintext DB
# password in cfg/QuerySQL.php - meant only to be reached via PHP include,
# never requested directly. The app already self-guards each file with an
# IN_KS constant check; this is defense in depth on top of that.
<Directory "/var/www/html/cfg">
    Require all denied
</Directory>
<Directory "/var/www/html/inc">
    Require all denied
</Directory>
<Directory "/var/www/html/app">
    Require all denied
</Directory>
