<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="The only inbound path from the internet is HTTPS 443 to the ALB in the public subnets, which forwards to the web Fargate service. eXist-db, the bastion and EFS sit in private application subnets, and Aurora in isolated subnets. All outbound traffic leaves through the NAT gateways.">
<style>
  svg { --fg:#1d1f23; --muted:#5d636d; --line:#c9ccd2; --band:#f1f0ec; --box:#ffffff; --accent:#c2410c;
        color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --fg:#e7e8ea; --muted:#9aa0aa; --line:#3a3e46; --band:#1d2026; --box:#23262d; --accent:#fb923c; }
  }
</style>
<title>Sanakirja network architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/>
    </marker>
  </defs>

  <g font-size="13" fill="currentColor">
  <!-- external actors -->
  <rect x="60" y="20" width="240" height="50" rx="25" style="fill:var(--box)" stroke="currentColor"/>
  <text x="180" y="50" text-anchor="middle" font-weight="600">Internet users</text>

  <rect x="800" y="20" width="260" height="50" rx="8" style="fill:var(--box)" stroke="currentColor"/>
  <text x="930" y="42" text-anchor="middle" font-weight="600">Admins</text>
  <text x="930" y="60" text-anchor="middle" font-size="11" style="fill:var(--muted)">AWS SSO, no SSH, no VPN</text>

  <!-- VPC -->
  <rect x="40" y="110" width="720" height="620" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="56" y="722" font-weight="600">VPC /23 · 2 AZs · 3 subnet tiers × 2 (/26 each)</text>

  <!-- IGW -->
  <rect x="120" y="96" width="120" height="28" rx="4" style="fill:var(--box)" stroke="currentColor"/>
  <text x="180" y="115" text-anchor="middle" font-size="11">Internet Gateway</text>

  <!-- public band -->
  <rect style="fill:var(--band);stroke:var(--line)" x="56" y="140" width="688" height="130" rx="6" stroke-dasharray="5 4"/>
  <text x="68" y="160" font-size="11" style="fill:var(--muted)">PUBLIC SUBNETS</text>
  <rect style="fill:var(--box);stroke:var(--accent)" x="80" y="180" width="250" height="74" rx="6" stroke-width="2"/>
  <text x="205" y="203" text-anchor="middle" font-weight="600">ALB (internet-facing)</text>
  <text x="205" y="222" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: 443 from 0.0.0.0/0</text>
  <text x="205" y="238" text-anchor="middle" font-size="11" style="fill:var(--muted)">ACM cert · TLS1.2 policy · no :80</text>
  <rect x="470" y="180" width="250" height="74" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="595" y="210" text-anchor="middle" font-weight="600">NAT Gateway × 2</text>
  <text x="595" y="230" text-anchor="middle" font-size="11" style="fill:var(--muted)">one per AZ · outbound only</text>

  <!-- application band -->
  <rect style="fill:var(--band);stroke:var(--line)" x="56" y="290" width="688" height="270" rx="6" stroke-dasharray="5 4"/>
  <text x="68" y="310" font-size="11" style="fill:var(--muted)">APPLICATION SUBNETS · private, egress via NAT</text>
  <rect style="fill:var(--box);stroke:var(--accent)" x="80" y="330" width="220" height="90" rx="6" stroke-width="2"/>
  <text x="190" y="356" text-anchor="middle" font-weight="600">Web · ECS Fargate</text>
  <text x="190" y="375" text-anchor="middle" font-size="11" style="fill:var(--muted)">Apache + PHP 8.3 (KS app)</text>
  <text x="190" y="391" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: 8080 from ALB, bastion</text>
  <text x="190" y="407" text-anchor="middle" font-size="11" style="fill:var(--muted)">no public IP</text>

  <rect x="470" y="330" width="250" height="90" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="595" y="356" text-anchor="middle" font-weight="600">eXist-db 6.4 · ECS Fargate</text>
  <text x="595" y="375" text-anchor="middle" font-size="11" style="fill:var(--muted)">internal only, no ALB rule</text>
  <text x="595" y="391" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: 8086 from web, bastion</text>
  <text x="595" y="407" text-anchor="middle" font-size="11" style="fill:var(--muted)">reached via Cloud Map private DNS</text>

  <rect x="80" y="460" width="220" height="80" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="190" y="484" text-anchor="middle" font-weight="600">Bastion · EC2 t3.nano</text>
  <text x="190" y="502" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: none (SSM only)</text>
  <text x="190" y="518" text-anchor="middle" font-size="11" style="fill:var(--muted)">reaches 8080 · 8086 · 5432 · 2049</text>

  <rect x="470" y="460" width="250" height="80" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="595" y="488" text-anchor="middle" font-weight="600">EFS · /exist/data</text>
  <text x="595" y="506" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: 2049 from eXist-db, bastion</text>
  <text x="595" y="522" text-anchor="middle" font-size="11" style="fill:var(--muted)">AWS Backup daily, 7 days</text>

  <!-- isolated band -->
  <rect style="fill:var(--band);stroke:var(--line)" x="56" y="580" width="688" height="120" rx="6" stroke-dasharray="5 4"/>
  <text x="68" y="600" font-size="11" style="fill:var(--muted)">RDS SUBNETS · isolated, no route to the internet</text>
  <rect x="290" y="614" width="260" height="74" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="420" y="640" text-anchor="middle" font-weight="600">Aurora PostgreSQL 16</text>
  <text x="420" y="659" text-anchor="middle" font-size="11" style="fill:var(--muted)">search-word index (hakusanat)</text>
  <text x="420" y="675" text-anchor="middle" font-size="11" style="fill:var(--muted)">SG in: 5432 from web, bastion</text>

  <!-- AWS services outside VPC -->
  <rect x="800" y="140" width="260" height="400" rx="10" fill="none" stroke="currentColor" stroke-dasharray="5 4"/>
  <text x="930" y="164" text-anchor="middle" font-weight="600">AWS APIs (public endpoints)</text>
  <g font-size="12">
    <text x="820" y="196">ECR (utility account)</text>
    <text x="820" y="212" font-size="11" style="fill:var(--muted)">image pulls, org-wide pull policy</text>
    <text x="820" y="246">Secrets Manager · SSM params</text>
    <text x="820" y="262" font-size="11" style="fill:var(--muted)">DB/eXist passwords injected at start</text>
    <text x="820" y="296">SSM Session Manager</text>
    <text x="820" y="312" font-size="11" style="fill:var(--muted)">bastion holds outbound channel</text>
    <text x="820" y="346">CloudWatch Logs · alarms</text>
    <text x="820" y="362" font-size="11" style="fill:var(--muted)">→ SNS → Chatbot → Slack</text>
    <text x="820" y="396">S3: ALB logs, transfer bucket</text>
    <text x="820" y="412" font-size="11" style="fill:var(--muted)">block-public-access, KMS</text>
    <text x="820" y="446">Route 53 · ACM</text>
    <text x="820" y="462" font-size="11" style="fill:var(--muted)">public hosted zone per environment, DNS-validated cert</text>
    <text x="820" y="496" font-size="11" style="fill:var(--muted)">No VPC endpoints: every call</text>
    <text x="820" y="512" font-size="11" style="fill:var(--muted)">here goes out via NAT.</text>
  </g>

  <rect x="800" y="600" width="260" height="70" rx="6" style="fill:var(--box)" stroke="currentColor"/>
  <text x="930" y="628" text-anchor="middle" font-weight="600">GitHub Actions</text>
  <text x="930" y="648" text-anchor="middle" font-size="11" style="fill:var(--muted)">OIDC role · build, push, cdk deploy</text>
  </g>

  <!-- inbound path (accent) -->
  <g style="stroke:var(--accent)" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="180" y1="70" x2="180" y2="94"/>
    <line x1="180" y1="124" x2="180" y2="178"/>
    <line x1="190" y1="254" x2="190" y2="328"/>
  </g>
  <g font-size="12" style="fill:var(--accent)" font-weight="600">
    <text x="190" y="152">HTTPS :443</text>
    <text x="200" y="286">HTTP :8080 · rule /* (prio 49000)</text>
  </g>

  <!-- internal flows -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="300" y1="375" x2="468" y2="375"/>
    <polyline points="300,405 380,405 380,612"/>
    <line x1="595" y1="420" x2="595" y2="458"/>
    <line x1="660" y1="328" x2="660" y2="256"/>
    <line x1="720" y1="217" x2="798" y2="217"/>
    <line x1="930" y1="70" x2="930" y2="138"/>
    <line x1="930" y1="600" x2="930" y2="542"/>
  </g>
  <g font-size="11" fill="currentColor">
    <text x="384" y="368" text-anchor="middle">REST/XQuery :8086</text>
    <text x="388" y="560">SQL :5432</text>
    <text x="388" y="574">read-only ksuser</text>
    <text x="603" y="444">NFS :2049</text>
    <text x="652" y="290" text-anchor="end">all app-tier egress</text>
    <text x="759" y="208" text-anchor="middle">HTTPS</text>
    <text x="940" y="100">console / CLI</text>
    <text x="940" y="116">session start</text>
    <text x="940" y="580">push images, deploy</text>
  </g>
</svg>
